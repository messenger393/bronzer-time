<style>body{margin:0;background:#1c1712;color:#e8dcc0;font:14px Georgia,serif}h1{font-size:20px;padding:12px 16px 0;margin:0}.note{padding:4px 16px;color:#b8a888}
#g{display:flex;flex-wrap:wrap;gap:14px;padding:14px}figure{margin:0;background:#2a221a;border:1px solid #4a3a28;border-radius:8px;padding:8px}figcaption{padding:6px 2px 0;max-width:760px;font-size:13px;color:#d8c8a8}figcaption b{color:#f0d890}</style></head>
<body><h1>Bronze and Blood — redesigned buildings (concept sheet, review only)</h1><div class="note">Top-down, roofs cut away. 1 tile = 32 px (drawn at 2×). People ≈ 0.6 tile wide, beds ≈ 1×2 tiles.</div><div id="g"></div>
<script>
const T=32,K=2;
// ---------- rng / colour ----------
let SEED=1;const rnd=()=>{SEED=(SEED*16807)%2147483647;return SEED/2147483647};const R=(a,b)=>a+rnd()*(b-a);const pick=a=>a[Math.floor(rnd()*a.length)];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];const sh=(h,a)=>{const c=hx(h).map(v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a)))));return'rgb('+c.join(',')+')'};
const OL='rgba(34,22,12,.9)';
function soft(g,f,b=7,dx=3,dy=4,a=.42){g.save();g.shadowColor='rgba(15,8,2,'+a+')';g.shadowBlur=b*K;g.shadowOffsetX=dx*K;g.shadowOffsetY=dy*K;f();g.restore()}
function rr(g,x,y,w,h,r,fill,st,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(st){g.strokeStyle=st;g.lineWidth=lw||1;g.stroke()}}
function circ(g,x,y,r,fill,st,lw){g.beginPath();g.arc(x,y,r,0,6.2832);if(fill){g.fillStyle=fill;g.fill()}if(st){g.strokeStyle=st;g.lineWidth=lw||1;g.stroke()}}
function ell(g,x,y,rx,ry,fill,st,lw,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,6.2832);if(fill){g.fillStyle=fill;g.fill()}if(st){g.strokeStyle=st;g.lineWidth=lw||1;g.stroke()}}
function ln(g,a,b,c,d,col,w){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.strokeStyle=col;g.lineWidth=w||1;g.lineCap='round';g.stroke()}
// ---------- floors ----------
function floor(g,x,y,w,h,k){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
 if(k==='earth'){g.fillStyle='#9a7a52';g.fillRect(x,y,w,h);for(let i=0;i<w*h/30;i++){circ(g,R(x,x+w),R(y,y+h),R(.4,1.6),pick(['rgba(70,50,30,.25)','rgba(190,160,110,.25)','rgba(120,90,60,.3)']))}for(let i=0;i<w*h/2500;i++)ell(g,R(x,x+w),R(y,y+h),R(10,30),R(6,16),'rgba(60,40,20,.08)')}
 else if(k==='plaster'){g.fillStyle='#e6dcc4';g.fillRect(x,y,w,h);for(let i=0;i<w*h/60;i++)circ(g,R(x,x+w),R(y,y+h),R(.3,1),'rgba(150,130,100,.18)');for(let i=0;i<w*h/9000;i++){let px=R(x,x+w),py=R(y,y+h);g.beginPath();g.moveTo(px,py);for(let k=0;k<4;k++){px+=R(-14,14);py+=R(-14,14);g.lineTo(px,py)}g.strokeStyle='rgba(120,100,70,.25)';g.lineWidth=.6;g.stroke()}}
 else if(k==='tile'){for(let yy=y;yy<y+h;yy+=16)for(let xx=x;xx<x+w;xx+=16){rr(g,xx+.6,yy+.6,14.8,14.8,1.2,pick(['#b8664a','#c47456','#a95c42','#bd6e50']));ln(g,xx+2,yy+2,xx+13,yy+2,'rgba(255,220,190,.18)',1)}g.fillStyle='rgba(60,40,30,.0)'}
 else if(k==='flag'){g.fillStyle='#6e6a62';g.fillRect(x,y,w,h);let yy=y;while(yy<y+h){const rh=R(14,24);let xx=x-R(0,20);while(xx<x+w){const rw=R(18,34);rr(g,xx+1,yy+1,rw-2,rh-2,3,sh('#a8a294',R(-.15,.12)));xx+=rw}yy+=rh}}
 else if(k==='plank'){for(let yy=y;yy<y+h;yy+=8){let xx=x-R(0,40);while(xx<x+w){const L=R(40,90);rr(g,xx,yy,L-1,7.4,1,sh('#9a6c40',R(-.12,.1)));xx+=L}ln(g,x,yy+7.7,x+w,yy+7.7,'rgba(40,25,10,.4)',.6)}}
 else if(k==='court'){g.fillStyle='#c8b080';g.fillRect(x,y,w,h);for(let i=0;i<w*h/25;i++)circ(g,R(x,x+w),R(y,y+h),R(.4,1.4),pick(['rgba(110,90,60,.25)','rgba(230,210,170,.3)']))}
 g.restore()}
// ---------- walls ----------
function wall(g,x,y,w,h,k,opt={}){// axis-aligned wall slab, roof cut away (top surface view)
 soft(g,()=>rr(g,x,y,w,h,1.5,'#000'),6,3,4,.45);g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
 if(k==='mud'||k==='white'){const base=k==='white'?'#ece4d2':'#a8784a';g.fillStyle=base;g.fillRect(x,y,w,h);const horiz=w>=h;const bl=horiz?12:6,bw=horiz?6:12;
  for(let yy=y,row=0;yy<y+h;yy+=bw,row++)for(let xx=x-(row%2)*bl/2;xx<x+w;xx+=bl){rr(g,xx+.7,yy+.7,bl-1.4,bw-1.4,.8,sh(base,R(-.12,.08)))}
  if(k==='white'){g.fillStyle='rgba(255,255,250,.35)';g.fillRect(x,y,w,h)}if(opt.band){g.fillStyle=opt.band;horiz?g.fillRect(x,y+h-2.5,w,2.5):g.fillRect(x+w-2.5,y,2.5,h)}}
 else if(k==='stone'){g.fillStyle='#5a564e';g.fillRect(x,y,w,h);for(let i=0;i<w*h/40;i++){const r=R(3,7);ell(g,R(x,x+w),R(y,y+h),r,r*R(.6,.9),sh('#a49c8c',R(-.2,.1)),'rgba(40,36,30,.5)',.6,R(0,3))}}
 else if(k==='ashlar'){g.fillStyle='#8a8478';g.fillRect(x,y,w,h);const horiz=w>=h;for(let yy=y,row=0;yy<y+h;yy+=horiz?h/2:14,row++)for(let xx=x-(row%2)*9;xx<x+w;xx+=horiz?18:w/2)rr(g,xx+.8,yy+.8,(horiz?18:w/2)-1.6,(horiz?h/2:14)-1.6,1,sh('#c2baa8',R(-.1,.06)))}
 g.fillStyle='rgba(255,245,220,.18)';g.fillRect(x,y,w,1.6);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,y+h-1.6,w,1.6);g.restore();g.strokeStyle='rgba(30,20,10,.55)';g.lineWidth=.8;g.strokeRect(x,y,w,h)}
// rectangular room outline with door gaps: doors=[[side,pos,width]] side N/S/E/W, pos in px from left/top
function room(g,x,y,w,h,th,k,doors=[],opt){const segs={N:[[x,y,w,th]],S:[[x,y+h-th,w,th]],W:[[x,y,th,h]],E:[[x+w-th,y,th,h]]};
 for(const[s,p,dw]of doors){const out=[];for(const sg of segs[s]){const[a,b,c,d]=sg;if(s==='N'||s==='S'){const L=x+p,Rr=x+p+dw;if(Rr<=a||L>=a+c){out.push(sg);continue}if(L>a)out.push([a,b,L-a,d]);if(Rr<a+c)out.push([Rr,b,a+c-Rr,d])}else{const L=y+p,Rr=y+p+dw;if(Rr<=b||L>=b+d){out.push(sg);continue}if(L>b)out.push([a,b,c,L-b]);if(Rr<b+d)out.push([a,Rr,c,b+d-Rr])}}segs[s]=out}
 for(const s in segs)for(const[a,b,c,d]of segs[s])wall(g,a,b,c,d,k,opt);for(const[s,p,dw]of doors){if(s==='N'||s==='S'){const yy=s==='N'?y:y+h-th;rr(g,x+p,yy+th/2-1.5,dw,3,1,'#6a4626',OL,.6)}else{const xx=s==='W'?x:x+w-th;rr(g,xx+th/2-1.5,y+p,3,dw,1,'#6a4626',OL,.6)}}}
// ---------- furniture & props (sizes in px, 32px = 1 tile) ----------
function bed(g,x,y,lin,rot,rich){g.save();g.translate(x,y);g.rotate(rot||0);soft(g,()=>rr(g,-15,-30,30,60,3,'#6a4626'));rr(g,-15,-30,30,60,3,'#7a5232',OL,1);for(const[a,b]of[[-15,-30],[11,-30],[-15,26],[11,26]])rr(g,a,b,4,4,1,'#5a3a1c');rr(g,-12,-18,24,44,3,lin);ln(g,-12,-6,12,-6,sh(lin,-.12),1);for(let i=0;i<5;i++)ln(g,-10+i*5,-4,-11+i*5,24,'rgba(0,0,0,.08)',1);
 if(rich){rr(g,-9,-28,18,8,4,'#d8b878',OL,.7);ln(g,-7,-24,7,-24,'#a07a3a',1)}else rr(g,-10,-27,20,8,3,'#efe6d0',OL,.6);g.restore()}
function pallet(g,x,y,col,rot){g.save();g.translate(x,y);g.rotate(rot||0);soft(g,()=>rr(g,-13,-26,26,52,4,'#000'),4,2,2,.3);rr(g,-13,-26,26,52,4,'#c8b07a');for(let i=-24;i<24;i+=3)ln(g,-12,i,12,i,'rgba(120,90,40,.35)',.7);rr(g,-11,-6,22,30,4,col,'rgba(0,0,0,.25)',.6);rr(g,-8,-23,16,7,3,'#d8c8a0');g.restore()}
function rug(g,x,y,w,h,c1,c2,c3){soft(g,()=>rr(g,x,y,w,h,2,c1),3,1,1,.25);rr(g,x+4,y+4,w-8,h-8,1,null,c2,2.4);rr(g,x+9,y+9,w-18,h-18,1,null,c3,1.4);for(let i=x+14;i<x+w-14;i+=10)for(let j=y+14;j<y+h-14;j+=10){g.save();g.translate(i+5,j+5);g.rotate(.785);g.fillStyle=(i+j)%20?c2:c3;g.fillRect(-2,-2,4,4);g.restore()}for(let i=x+2;i<x+w;i+=3){ln(g,i,y,i,y-3,c2,.7);ln(g,i,y+h,i,y+h+3,c2,.7)}}
function mat(g,x,y,w,h){rr(g,x,y,w,h,2,'#c8b070');for(let i=y+3;i<y+h;i+=4)ln(g,x+1,i,x+w-1,i,'rgba(110,80,30,.35)',.8);rr(g,x,y,w,h,2,null,'#9a8048',1.2)}
function table(g,x,y,w,h,col){soft(g,()=>rr(g,x,y,w,h,2,col||'#8a5e34'));rr(g,x,y,w,h,2,col||'#8a5e34',OL,.8);for(let i=y+3;i<y+h-1;i+=4)ln(g,x+2,i,x+w-2,i,'rgba(255,220,170,.12)',1)}
function stool(g,x,y){soft(g,()=>circ(g,x,y,5,'#000'),3,1,2,.35);circ(g,x,y,5,'#9a6c40',OL,.7);circ(g,x-1,y-1,2,'rgba(255,230,190,.2)')}
function chest(g,x,y,w,h,rich){soft(g,()=>rr(g,x,y,w,h,2,'#000'));rr(g,x,y,w,h,2,rich?'#6a3a1e':'#8a6038',OL,.9);ln(g,x,y+h*.38,x+w,y+h*.38,'rgba(0,0,0,.35)',1.2);if(rich){g.fillStyle='#2e6db0';for(let i=x+4;i<x+w-4;i+=7)rr(g,i,y+h*.55,4,4,1,'#2e6db0');circ(g,x+w/2,y+h*.38,1.8,'#e0b040')}}
function jar(g,x,y,r,col){soft(g,()=>circ(g,x,y,r,'#000'),4,2,3,.35);const gr=g.createRadialGradient(x-r*.4,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,sh(col||'#b8643a',.25));gr.addColorStop(1,sh(col||'#b8643a',-.25));circ(g,x,y,r,gr,OL,.8);circ(g,x,y,r*.42,'#3a1e0e');circ(g,x,y,r*.42,null,sh(col||'#b8643a',.1),1.2)}
function pithos(g,x,y,r){jar(g,x,y,r,'#b4784a');for(let k=.62;k<.95;k+=.16)circ(g,x,y,r*k,null,'rgba(70,40,20,.35)',1.2);for(let a=0;a<6.28;a+=.8)ln(g,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,x+Math.cos(a)*r*.92,y+Math.sin(a)*r*.92,'rgba(70,40,20,.25)',1)}
function sack(g,x,y,rot){g.save();g.translate(x,y);g.rotate(rot||0);soft(g,()=>ell(g,0,0,7,5,'#000'),3,1,2,.3);ell(g,0,0,7,5,'#d8c69a',OL,.6);ell(g,-4,0,2.4,2,'#c0ac80');ln(g,-5,-1,-5,1,'#7a6040',1);g.restore()}
function hearth(g,x,y,r,m){soft(g,()=>circ(g,x,y,r,'#000'));const n=Math.round(r*.9);for(let i=0;i<n;i++){const a=i/n*6.283;circ(g,x+Math.cos(a)*r*.82,y+Math.sin(a)*r*.82,r*.22,sh('#8a847a',R(-.15,.1)),OL,.5)}circ(g,x,y,r*.6,'#3a2414');ln(g,x-r*.4,y-r*.1,x+r*.4,y+r*.15,'#5a3a1c',2.4);ln(g,x-r*.3,y+r*.3,x+r*.35,y-r*.3,'#6a4626',2.4);circ(g,x,y,r*.32,'#f08a30');circ(g,x,y,r*.15,'#fce890');glow(m,x,y,r*5)}
function oven(g,x,y,r){soft(g,()=>circ(g,x,y,r,'#000'));const gr=g.createRadialGradient(x-r*.3,y-r*.4,1,x,y,r);gr.addColorStop(0,'#c49a6a');gr.addColorStop(1,'#7a5432');circ(g,x,y,r,gr,OL,1);for(let k=.4;k<1;k+=.2)circ(g,x,y,r*k,null,'rgba(60,40,20,.2)',1);rr(g,x-r*.35,y+r*.55,r*.7,r*.5,3,'#2a1a0e');circ(g,x,y+r*.7,r*.18,'#e8702a')}
function quern(g,x,y){soft(g,()=>ell(g,x,y,11,7,'#000'),4,2,2,.35);ell(g,x,y,11,7,'#8e887c',OL,.8);ell(g,x,y-1,9,5,'#a8a294');rr(g,x-4,y-3,8,5,2,'#6e6a62',OL,.6);for(let i=0;i<6;i++)circ(g,x+R(-7,7),y+R(-3,4),.8,'#efe2b8')}
function loom(g,x,y,w,rot){g.save();g.translate(x,y);g.rotate(rot||0);soft(g,()=>rr(g,-w/2,-4,w,8,1,'#000'));rr(g,-w/2,-5,w,4,1,'#7a5232',OL,.6);for(let i=-w/2+3;i<w/2-2;i+=2.2)ln(g,i,-1,i,10,pick(['#e8dcc0','#c84a2c','#e8dcc0','#2e6db0']),.7);rr(g,-w/2+2,0,w-4,6,1,'rgba(200,74,44,.55)');for(let i=-w/2+4;i<w/2-3;i+=5)circ(g,i,13,2.2,'#a8a294',OL,.5);for(const s of[-1,1])rr(g,s*w/2-2,-7,4,22,1,'#6a4626',OL,.6);g.restore()}
function shelf(g,x,y,w,items){soft(g,()=>rr(g,x,y,w,10,1,'#000'));rr(g,x,y,w,10,1,'#7a5232',OL,.7);for(let i=0;i<items;i++){const cx=x+5+i*(w-10)/Math.max(1,items-1);if(i%3===2)rr(g,cx-3,y+2,6,6,1,'#c8b490',OL,.4);else circ(g,cx,y+5,3.2,pick(['#b8643a','#c8a868','#8a5a3a','#3a8ab8']),OL,.5)}}
function lamp(g,x,y,m){circ(g,x,y,3.2,'#b8643a',OL,.6);circ(g,x+2.4,y-1,1.4,'#fce890');glow(m,x+2,y,60)}
function brazier(g,x,y,m){soft(g,()=>circ(g,x,y,8,'#000'));circ(g,x,y,8,'#a07a3a',OL,1);circ(g,x,y,5.5,'#3a1a0c');circ(g,x,y,3.5,'#f8a040');circ(g,x,y,1.6,'#fff0a0');glow(m,x,y,90)}
function column(g,x,y,r,col,cap){soft(g,()=>circ(g,x,y,r,'#000'),7,4,5,.45);circ(g,x,y,r,col||'#e6dcc4',OL,1.2);if(cap){circ(g,x,y,r*.75,null,cap,2)}for(let a=0;a<6.28;a+=.5)ln(g,x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,x+Math.cos(a)*r*.95,y+Math.sin(a)*r*.95,'rgba(0,0,0,.12)',1);circ(g,x-r*.3,y-r*.3,r*.3,'rgba(255,255,255,.35)')}
function plant(g,x,y,r){soft(g,()=>circ(g,x,y,r*.5,'#000'),3,1,2,.3);circ(g,x,y,r*.45,'#a0583a',OL,.7);for(let i=0;i<9;i++){const a=i/9*6.283+R(-.2,.2);g.save();g.translate(x,y);g.rotate(a);ell(g,r*.55,0,r*.6,r*.18,pick(['#4a8a3a','#5a9a40','#3e7a30']));g.restore()}}
function palm(g,x,y,r){soft(g,()=>circ(g,x,y,r*.6,'#000'),10,8,10,.35);for(let i=0;i<9;i++){const a=i/9*6.283;g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(r*.6,-r*.25,r,0);g.quadraticCurveTo(r*.6,r*.18,0,0);g.fillStyle=i%2?'#4a8a3a':'#3e7a2e';g.fill();for(let k=.2;k<.95;k+=.12)ln(g,r*k,0,r*k+3,-4,'#2e5a20',.6);g.restore()}circ(g,x,y,3,'#7a5a30')}
function pool(g,x,y,w,h){soft(g,()=>rr(g,x,y,w,h,3,'#000'));rr(g,x,y,w,h,3,'#d8ccb0',OL,1);const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,'#3a7aa8');gr.addColorStop(1,'#2a5a88');rr(g,x+4,y+4,w-8,h-8,2,gr);for(let i=0;i<5;i++){ell(g,x+R(10,w-10),y+R(10,h-10),6,3,'#5a9a40');circ(g,x+R(10,w-10),y+R(10,h-10),2,'#f0f0f8')}for(let i=0;i<4;i++)ln(g,x+R(8,w-20),y+R(8,h-8),x+R(20,w-8),y+R(8,h-8),'rgba(255,255,255,.25)',1)}
function altar(g,x,y,w,h,m){soft(g,()=>rr(g,x,y,w,h,2,'#000'),8,4,5,.5);rr(g,x,y,w,h,2,'#e2d6b8',OL,1.2);rr(g,x+3,y+3,w-6,h-6,1,null,'#b89a5a',1);circ(g,x+w/2,y+h/2,Math.min(w,h)*.22,'#8a2a1c');circ(g,x+w/2,y+h/2,Math.min(w,h)*.12,'#e8702a');glow(m,x+w/2,y+h/2,80);for(const[a,b]of[[x+4,y+4],[x+w-4,y+4],[x+4,y+h-4],[x+w-4,y+h-4]])circ(g,a,b,2,'#e0b040')}
function offering(g,x,y){table(g,x,y,26,16,'#d8ccb0');circ(g,x+6,y+8,3.5,'#c8a040');ell(g,x+15,y+8,4,3,'#e8c86a');circ(g,x+21,y+6,2.4,'#7aa83e');circ(g,x+22,y+11,2,'#c04a3a')}
function statue(g,x,y,col){soft(g,()=>rr(g,x-9,y-9,18,18,2,'#000'),8,5,6,.5);rr(g,x-9,y-9,18,18,2,'#b8ae98',OL,1);circ(g,x,y-1,4.5,col||'#e0b040',OL,.8);rr(g,x-5,y+2,10,6,2,col||'#e0b040',OL,.6)}
function weaponrack(g,x,y,w,rot){g.save();g.translate(x,y);g.rotate(rot||0);soft(g,()=>rr(g,-w/2,-3,w,6,1,'#000'));rr(g,-w/2,-3,w,6,1,'#6a4626',OL,.7);for(let i=-w/2+4;i<w/2-2;i+=6){ln(g,i,-14,i,14,'#8a6038',1.6);g.beginPath();g.moveTo(i,-14);g.lineTo(i-2,-10);g.lineTo(i+2,-10);g.closePath();g.fillStyle='#c8a040';g.fill()}g.restore()}
