const FORM={line:{n:'Line',d:'Balanced, no modifiers.'},phalanx:{n:'Phalanx',d:'Front def ×1.6, atk ×0.9, slow; flanked front collapses (def ×0.65, big morale hit).'},wedge:{n:'Wedge',d:'Front atk ×1.5 first 2 clash rounds; def ×0.85.'},skirmish:{n:'Skirmish',d:'Missiles hurt ×0.7; melee def ×0.75.'},flank:{n:'Flanking',d:'Flank units ×1.35 atk & arrive faster; front def ×0.9.'}};

{n:'Tin Hills',terr:'hills',form:'line',m:-10,army:[['spear',6],['slinger',4]],x:150,y:30,rw:'res',v:'tin',d:'Unlocks Tin Mine'},
{n:'Goat Valley',terr:'plains',form:'skirmish',m:-5,army:[['spear',8],['archer',6],['slinger',4]],x:40,y:100,rw:'job',v:'herder',d:'Herder job'},
{n:'Copper Ridge',terr:'hills',form:'phalanx',m:0,army:[['spear',10,1],['axeman',6],['archer',6]],x:200,y:70,rw:'bonus',v:'copper',d:'Copper +50%'},
{n:'Old Shrine',terr:'forest',form:'skirmish',m:0,army:[['axeman',8,1],['spear',8,1],['archer',10]],x:110,y:120,rw:'tech',v:'writing',d:'Free Writing'},
{n:'River Ford',terr:'river',form:'phalanx',m:5,army:[['spear',10,1,30],['spear',8,1],['slinger',8],['archer',6]],x:20,y:20,rw:'bonus',v:'food',d:'Food +30%'},
{n:'Cedar Wood',terr:'forest',form:'wedge',m:5,army:[['axeman',10,1,30],['maceman',6,1],['archer',8,0,30]],x:230,y:130,rw:'bonus',v:'wood',d:'Wood +50%'},
{n:'Horse Plains',terr:'plains',form:'flank',m:10,army:[['lchariot',8,0,60],['hoplite',10,1],['spear',10,1],['archer',10]],x:180,y:110,rw:'tech',v:'chariots',d:'Free Chariots'},
{n:'Salt Desert',terr:'desert',form:'skirmish',m:10,army:[['lchariot',6,0,60],['compbow',10,0,60],['axeman',10,1,60]],x:90,y:10,rw:'bonus',v:'stone',d:'Stone +50%'},
{n:'Bronze Citadel',terr:'walls',form:'phalanx',m:20,army:[['hoplite',10,2,60],['hoplite',10,2],['guard',8,3,150],['compbow',10,1,60],['maceman',8,2]],x:240,y:20,rw:'bonus',v:'bronze',d:'Bronze +100%. Victory!'}];
const NICK=['Bulls','Lions','Falcons','Scorpions','Vipers','Rams','Jackals','Wolves','Bears','Hawks','Oxen','Cobras','Eagles','Boars','Asps','Ibexes'];
const CMAX=10;
const defSlot=t=>UNIT[t].chariot?'flank':UNIT[t].rng?'back':'front';
const armyCap=()=>cnt('barracks')*6;
const armyN=()=>(S.companies||[]).reduce((a,c)=>a+c.men,0);
function unitLock(t){const U=UNIT[t];if(U.tier&&S.tier<U.tier)return'Needs '+TIERS[U.tier].n;if(U.tech&&!S.tech[U.tech])return'Needs '+TECH[U.tech].n;return''}
function recruit(t){if(armyN()>=armyCap()||!pay(UNIT[t].cost))return;let c=S.companies.find(c=>c.type===t&&c.men<CMAX);
 if(!c){S.cid=(S.cid||0)+1;c={id:S.cid,name:NICK[(S.cid-1)%NICK.length]+(S.cid>NICK.length?' '+Math.ceil(S.cid/NICK.length):''),type:t,men:0,xp:0,armor:0,slot:defSlot(t)};S.companies.push(c);log('New company raised: '+c.name+' ('+UNIT[t].n+')')}
 c.xp=c.xp*c.men/(c.men+1);c.men++}
function armorCost(c){const A=ARMOR[c.armor+1];if(!A)return null;const o={};for(const r in A.cost)o[r]=A.cost[r]*c.men;return o}
// ---- battle simulation (pure, testable) ----
function mkGroup(c,side){const U=UNIT[c.type],rk=rank(c.xp||0);return{id:c.id,name:c.name,type:c.type,U,side,slot:c.slot||defSlot(c.type),men:c.men,men0:c.men,arm:U.arm+(c.armor||0),rk,morale:100+rk[3]+(U.morale||0)+(Math.random()*30-15),routed:false,lost:0,acc:0,fp:0}}
function simBattle(A,D,o){const rnd=o.rnd||Math.random,T=o.terrain,log=[],frames=[];
 const G=[...A.map(c=>mkGroup(c,0)),...D.map(c=>mkGroup(c,1))];
 G.forEach(g=>g.morale+=g.side?(o.moraleD||0)+(T==='walls'?25:0):(o.moraleA||0));
 const form=s=>s?o.fd:o.fa,sideN=g=>g.side?'Enemy':'Our';
 const alive=(s,sl)=>G.filter(g=>g.side===s&&!g.routed&&g.men>0&&(!sl||g.slot===sl));
 const D0=T==='river'?4:3;let prog=[0,0],engaged=false,engR=0,breached=T!=='walls',ramR=0,ev=[];
 const speed=g=>{let s=g.U.spd-(g.arm>=3?.15:0);if(T==='marsh')s*=g.U.chariot?.3:.6;if(T==='forest'&&g.U.chariot)s*=.4;if(T==='hills'&&g.side===0)s*=.8;return s};
 function atkM(g,melee,fl){let m=1+g.rk[2]+(g.side===0?(o.genA||0)*.03:0);const f=form(g.side),U=g.U;
  if(U.chariot){if(T==='forest')m*=.3;if(T==='marsh')m*=.2;if(T==='plains')m*=1.25;if(T==='desert')m*=1.15}
  if(!melee){if(T==='forest')m*=.6;if(g.side===1&&T==='hills')m*=1.3;if(g.side===1&&T==='walls')m*=1.4}
  else{if(g.slot==='front'){if(f==='phalanx')m*=.9;if(f==='wedge'&&engR<=2)m*=1.5}
   if(U.rng&&!U.chariot)m*=.5;if(T==='river'&&g.side===0&&engR<=3)m*=.7;
   if(T==='walls'&&g.side===0&&!breached)m*=.45;if(T==='marsh'&&g.arm>=2)m*=.85}
  if(fl){m*=1.15;if(f==='flank')m*=1.3}return m}
 function defM(g,melee,fl){let m=1+g.rk[2];const f=form(g.side);
  if(g.slot==='front'){if(f==='phalanx')m*=fl?.65:1.6;if(f==='wedge')m*=.85;if(f==='flank')m*=.9}
  if(melee&&f==='skirmish')m*=.75;if(g.side===1&&T==='hills')m*=1.3;if(g.side===1&&T==='walls'&&!breached&&melee)m*=2.5;
  if(fl)m*=.8;return m}
 function hit(a,t,melee,fl){if(!t||!a.mr)return;let dm=a.mr*a.U.atk*atkM(a,melee,fl)*(.7+rnd()*.6)*.5;
  dm*=6/(6+t.U.def*defM(t,melee,fl)*(melee?1:.4));
  const ar=Math.max(0,t.arm-a.U.ap);dm*=Math.max(.25,1-ar*.12*(melee?1:1.35));if(!melee&&a.U.chariot)dm*=.6;
  if(!melee&&form(t.side)==='skirmish')dm*=.7;
  t.acc+=dm/t.U.hp;const dead=Math.min(t.men,Math.floor(t.acc));t.acc-=dead;t.men-=dead;t.lost+=dead;t.rl+=dead;
  if(fl)t.flanked=1;if(a.U.shock&&melee)t.shock+=a.men*.6;ev.push({k:melee?(fl?'f':'m'):'r',a:a.side+':'+a.id,t:t.side+':'+t.id})}
 const pick=(s,pref)=>{for(const sl of pref){const l=alive(s,sl);if(l.length)return l[Math.floor(rnd()*l.length)]}return null};
 let r;
 for(r=1;r<=30;r++){ev=[];G.forEach(g=>{g.rl=0;g.flanked=0;g.shock=0;g.mr=g.routed?0:g.men});
  if(!engaged){for(const s of[0,1]){const fr=alive(s,'front');let sp=fr.length?Math.min(...fr.map(speed)):1;if(form(s)==='phalanx')sp*=.7;if(s===1&&(T==='hills'||T==='walls'))sp=0;if(s===0&&T==='river')sp*=.6;prog[s]+=sp*.8}
   if(prog[0]+prog[1]>=D0||!alive(0,'front').length||!alive(1,'front').length){engaged=true;log.push('R'+r+': The battle lines clash!')}}
  if(engaged)engR++;
  if(engaged&&!breached&&alive(0).some(g=>g.U.siege)){ramR++;if(ramR>=3){breached=true;log.push('R'+r+': Our ram breaches the walls!')}}
  for(const g of G.filter(g=>!g.routed&&g.men>0&&g.U.rng)){if(g.slot==='front'&&engaged)continue;if(g.slot==='flank'&&g.arr)continue;{const tg=G.filter(e=>e.side!==g.side&&!e.routed&&e.men>0&&(e.slot==='front'||e.arr));hit(g,tg.length?tg[Math.floor(rnd()*tg.length)]:pick(1-g.side,['back','flank']),false,false)}}
  for(const g of G.filter(g=>!g.routed&&g.men>0&&g.slot==='flank')){if(g.side===0&&!breached)continue;g.fp+=speed(g)*(form(g.side)==='flank'?1.4:1)*.5*(T==='forest'?.6:1);
   if(g.fp>=2){if(!g.arr){g.arr=1;log.push('R'+r+': '+sideN(g)+' '+g.name+' ('+g.U.n+') reach the flank!')}
    const ef=alive(1-g.side,'flank').filter(e=>e.arr);if(ef.length)hit(g,ef[0],true,false);else hit(g,pick(1-g.side,['front','back']),true,true)}}
