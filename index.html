<script>

 for(let i=0;i<10;i++)ln(g,X-5+i*6,Y-5,X-7+i*6.3,Y+4,'rgba(60,40,20,.35)',.5);ln(g,X-7,Y+3.6,X+55,Y+3.6,'#c8a070',.6);axe(g,X+2,Y+18,-.25,.7);saw(g,X+45,Y+8,.7)}

/* ====================== V2 (Weston feedback) ======================

 for(const n of scnList()){const r=document.createElement('div');r.style.cssText='display:flex;gap:4px;margin:2px 0';const l=btn('Load "'+n+'"',()=>{devT();scnLoad(n);devPanel()});l.style.cssText='flex:1;font-size:11px;padding:3px';const x=btn('✕',()=>{scnDel(n);devPanel()});x.style.cssText='font-size:11px;padding:3px 6px';r.appendChild(l);r.appendChild(x);P.appendChild(r)}
 hd('Real pawn work (fast-forward)');add('Run real pawn work: 1 day',()=>devWork(1));add('Run real pawn work: 5 days',()=>devWork(5));add('Run real pawn work: 24 days (1 year)',()=>devWork(24));
 hd('Lumber Camp');add('Lumber Camp family: +1 working-age member',()=>devCampAddMember());add('Empty the firewood shed (splitting starts)',()=>{const s=devLumberCamp();if(s){s.st.firewood=0;s.splitOn=1}else log('Dev: no Lumber Camp family')});
 add('Fill the firewood shed',()=>{const s=devLumberCamp();if(s){s.st.firewood=FW_CAP;s.splitOn=0}});
 add('Go to the Lumber Camp',()=>{const s=devLumberCamp(),b=s&&campB(s);if(b){cam.z=cam.tz=1.2;centerOn(b.x+1,b.y+1);sel={i:S.bl.indexOf(b)};showInsp()}});
 hd('Farms (G1–G3)');add('Build scene: Farms test',()=>devSceneFarm());
 add('Farms: ripen all crops now',()=>{for(const s of S.eco.steads)if(s.pl)for(const i in s.pl){const r=s.pl[i];r.t=S.t-PL_T*DAYLEN*1.16}log('Dev: every sown plant is ripe')});
 add('Farms: sow every empty plot now (free seed)',()=>{let n=0;for(const s of S.eco.steads)if(s.pl)for(const i of s.f)if(!s.pl[i]){s.sc=(s.sc||0)+1;s.pl[i]={t:S.t,c:s.sc*7+3,h:0};n++}log('Dev: sowed '+n+' plots')});
 add('Farms: show per-plant yield (toggle)',()=>{S.devPl=!S.devPl});
 add('Farm family: empty food & savings (hard times test)',()=>{const s=devFarm();if(!s){log('Dev: no farm');return}for(const g of ECOFOOD)s.st[g]=0;s.sv=0;log('Dev: emptied the '+plFsn(s)+' family stores')});
 add('Farm families: build a hand cart now (15 logs given, then spent)',()=>{for(const s of S.eco.steads){if(s.camp||s.hc||s.ph==null)continue;s.st.timber=(s.st.timber||0)+HC_WOOD;s.st.timber-=HC_WOOD;s.hc=1;s.hcL=(Math.random()*CART_LOOKS.length)|0;farmNote(s,'The '+plFsn(s)+' family built a hand cart ('+CART_NAMES[s.hcL%5]+').')}});
 add('Go to a farm',()=>{const s=devFarm();if(s){cam.z=cam.tz=.9;centerOn(s.x+2,s.y+2);const i=S.bl.findIndex(b=>b.t==='stead'&&b.x===s.x&&b.y===s.y);if(i>=0){sel={i};showInsp()}}});
 add('Log farm report',()=>{for(const r of devFarmRep())log('Dev: '+r.fam+' ('+r.n+'): '+r.plots+' plots, '+r.sown+' sown, harvest '+r.harvest+', food '+r.food+' days'+(r.hard?' · HARD TIMES':''))});
 hd('Economy & time');
 const spawnWS=c0=>{const E=S.eco;if(!E)return;const t=WS_CR[c0];let L=cqLot('cq',t)||devLot(t);if(!L){log('Dev: no room for a '+BLD[t].n);return}
  const id=++E.sid;S.bl.push({t,l:1,x:L.X,y:L.Y,cr:id});/* dev spawn: same rule as a real split, 2 members leave the largest farm family */const P0=E.steads.filter(s=>!s.camp&&s.n>=3).sort((a,b)=>b.n-a.n)[0];let ag0=0,gr0=0;if(P0){const k=2/P0.n;ag0=c0==='baker'?0:(P0.sv||0)*k;P0.sv-=ag0;gr0=crShare(P0,k)}E.cr.push({id,c:c0,n:2,sk:3,ag:ag0,stk:0,x:L.X,y:L.Y,hun:0,ref:0,from:P0?P0.id:null,gr:gr0,dev:1});if(P0)log('Dev: the '+c0+' household took 2/'+P0.n+' of a farm family: '+Math.round(ag0)+' silver, '+gr0+' wheat-equiv.');S.pop+=2;rebuildOcc();E._wc=1;try{famSync()}catch(e){}log('Dev: spawned a '+CRAFT[c0].n.toLowerCase()+' household at '+L.X+','+L.Y)};
 add('Spawn a baker household',()=>spawnWS('baker'));
 add('Spawn a brewer household',()=>spawnWS('brewer'));
 add('Force baker + brewer petitions',()=>{const E=S.eco;if(!E||!E.steads.length)return;for(const c0 of ['baker','brewer']){const s=E.steads.slice().sort((a,b)=>b.n-a.n)[0];const F=famOf(s);const m=F&&F.m.find(m=>m.r!=='head'&&m.a>=16&&m.a<=55);if(!m){log('Dev: no adult to petition');continue}m.adv=m.adv||{};m.adv[c0]=Math.max(m.adv[c0]||0,40);s.n=Math.max(s.n,4);s.sv=Math.max(s.sv||0,30);(E.rp=E.rp||[]).push({c:c0,s:s.id,m:m.i,yr:E.yr})}log('Dev: petitions added (Administration › Petitions)')});
 add('Approve all petitions',()=>{const E=S.eco;if(!E)return;E.rp=E.rp||[];let n=0;for(let q=0;q<12&&E.rp.length;q++){const k=E.rp.length;riseApprove(0);if(E.rp.length===k)break;n++}log('Dev: approved '+n+' petition(s)'+(E.rp.length?' — '+E.rp.length+' wait for a Crafter Quarter lot':''))});
 add('Skip 1 year',()=>devSkip(yearLen()));
 const devZone=(k,n)=>{const L=devLot('craft');if(!L){log('Dev: no room');return}const t=[];for(let y=L.Y;y<L.Y+n;y++)for(let x=L.X;x<L.X+n;x++)t.push(y*MW+x);S[k]=(S[k]||[]).concat(t);log('Dev: painted '+(k==='mz'?'a Market zone':'a Crafter Quarter')+' '+n+'×'+n+' at '+L.X+','+L.Y)};
 add('Paint a Market zone (8×8)',()=>devZone('mz',8));
 add('Paint a Crafter Quarter (14×14)',()=>devZone('cq',14));
 add('Run a market day now',()=>{if(S.eco){mktDay();crownBuy()}});
 add('Feed everyone (hunger 0)',()=>{for(const a of agents)a.hung=0;if(S.fam)for(const F of S.fam.L)for(const m of F.m)m.hg=0});
 add('Starve everyone (hunger 0.9)',()=>{for(const a of agents)a.hung=.9});
 add((DEVO.occ?'Hide':'Show')+' occupancy / grid overlay',()=>{DEVO.occ=!DEVO.occ});
 add('FPS overlay (F3)',()=>{GFX.fps=!GFX.fps;fpsOv()});
 add('Close',()=>{DEVO.on=0})}
function devLot(t){let L=null;const hb=holdB()||{x:S.center.x,y:S.center.y};for(let r=8;r<40&&!L;r+=2)for(let k=0;k<24&&!L;k++){const x=Math.round(hb.x+Math.cos(k/24*6.283)*r),y=Math.round(hb.y+Math.sin(k/24*6.283)*r);if(!placeErr(t,x,y,true))L={X:x,Y:y}}return L}
function devSelMem(){try{let fa=sel&&sel.fm?[famById(sel.fm[0]),sel.fm[1]]:sel&&sel.a?famForAgent(sel.a):null;if(fa&&fa[0])return fa[0].m.find(m=>m.i===fa[1])||null}catch(e){}return null}
addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){e.preventDefault();DEVO.on=!DEVO.on;devPanel()}});
if(/[?&]dev\b/.test(location.search))setTimeout(()=>{DEVO.on=1;devPanel()},1500);
</script></body></html>
